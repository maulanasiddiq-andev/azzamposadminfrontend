<div class="search d-flex align-items-center gap-2 bg-body rounded-pill shadow-sm ps-3 p-1"
     role="search">

  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
       class="text-secondary flex-shrink-0" aria-hidden="true">
    <circle cx="11" cy="11" r="7"></circle>
    <path d="m20 20-3.5-3.5"></path>
  </svg>

  <input #searchInput type="search"
         class="form-control border-0 bg-transparent shadow-none p-0"
         [placeholder]="placeholder()" [attr.aria-label]="label()"
         [formControl]="control()">

  @if (control().value) {
    <button type="button"
            class="btn btn-link text-secondary p-0 me-2 d-flex flex-shrink-0"
            aria-label="Clear search"
            (click)="clearSearch()">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293z"/>
      </svg>
    </button>
  }
</div>
