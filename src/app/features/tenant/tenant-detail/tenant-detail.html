@if (tenant() != null) {
  <div class="row m-0">
    <div class="col-6 pt-2">
      <h1 class="page-title">Informasi Tenant</h1>
      <div class="info-column">
        <app-info-item [title]="'Kode'" [value]="tenant()?.kode"></app-info-item>
        <app-info-item [title]="'Nama'" [value]="tenant()?.nama"></app-info-item>
        <app-info-item [title]="'Email'" [value]="tenant()?.email"></app-info-item>
        <app-info-item [title]="'No WA'" [value]="tenant()?.noWA"></app-info-item>
        <app-info-item [title]="'Contact Person'" [value]="tenant()?.kontakPerson"></app-info-item>
        <app-info-item [title]="'Ukuran Kertas Alamat Pengiriman'" [value]="tenant()?.ukuranKertasAlamatPengiriman"></app-info-item>
        <app-info-item [title]="'Ukuran Kertas Label Pengiriman'" [value]="tenant()?.ukuranKertasLabelPengiriman"></app-info-item>
        <app-info-item [title]="'Ukuran Kertas Pesanan Penjualan'" [value]="tenant()?.ukuranKertasPesananPenjualan"></app-info-item>
        <app-info-item [title]="'Ukuran Kertas Invoice Penjualan'" [value]="tenant()?.ukuranKertasInvoicePenjualan"></app-info-item>
        <app-info-item [title]="'Alamat'" [value]="tenant()?.alamat"></app-info-item>
        <app-info-item [title]="'Tanggal Join'" [value]="tenant()?.joinDate | date:'dd-MM-yyyy'"></app-info-item>

        <app-info-item-toggle [title]="'Tampilkan Logo di Header Print Kasir'" [value]="tenant()?.isShowLogoHeaderPrintKasir"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Tampilkan Logo di Header Print Laporan'" [value]="tenant()?.isShowLogoHeaderPrintLaporan"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Tampilkan No HP pada Invoice'" [value]="tenant()?.isShowNoHpInvoice"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Tampilkan No WA pada Invoice'" [value]="tenant()?.isShowNoWaInvoice"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Menggunakan Sales Channel'" [value]="tenant()?.useSalesChannel"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Menggunakan Shipdeo'" [value]="tenant()?.isUseShipdeo"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Bisa Dikirim'" [value]="tenant()?.useBisaDikirim"></app-info-item-toggle>
        <app-info-item-toggle [title]="'Proses Stok Opname'" [value]="tenant()?.useProsesStokOpname"></app-info-item-toggle>
      </div>
    </div>

    <div class="col-6 pt-2">
      <h1 class="page-title">Fitur Tenant</h1>
      <div class="accordion">
        @for (menu of menus; track menu.category) {
          @let isOpen = openCategory() === menu.category;

          <section class="group" [class.open]="isOpen" [style.--accent]="menu.color">
            <button
              type="button"
              class="group-header"
              [attr.aria-expanded]="isOpen"
              (click)="toggle(menu.category)"
            >
              <span class="dot" aria-hidden="true"></span>
              <span class="title">{{ menu.category }}</span>
              <span class="count">{{ menu.children.length }}</span>
              <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>

            <div class="group-body">
              <ul>
                @for (item of menu.children; track item.link) {
                  <li>
                    <a [routerLink]="item.link">{{ item.title }}</a>
                  </li>
                }
              </ul>
            </div>
          </section>
        }
      </div>
    </div>
  </div>
}
