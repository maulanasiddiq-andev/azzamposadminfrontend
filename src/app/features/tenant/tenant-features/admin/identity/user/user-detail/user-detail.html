@if (user() != null) {
  <div class="row m-0">
    <div class="col-6 p-2">
      <app-info-item [title]="'Username'" [value]="user()?.username"></app-info-item>
      <app-info-item [title]="'Nama'" [value]="user()?.nama"></app-info-item>
      <app-info-item [title]="'Email'" [value]="user()?.email || '-'"></app-info-item>
      <app-info-item [title]="'Login Gagal'" [value]="(user()?.accessFailedCount || 0).toString()"></app-info-item>
      <app-info-item-toggle [title]="'Login dengan Telegram'" [value]="user()?.isUseTelegramForLogin"></app-info-item-toggle>
      <app-info-item [title]="'Deskripsi'" [value]="user()?.deskripsi || '-'"></app-info-item>
      <app-info-item-toggle [title]="'Aktif'" [value]="user()?.recordStatus == 'Active'"></app-info-item-toggle>
    </div>
  </div>
}
